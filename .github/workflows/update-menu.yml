
name: Update school menu

on:
  schedule:
    - cron: "17 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-menu:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: pip install requests beautifulsoup4 pymupdf

      - name: Download current elementary menus
        run: |
          python - <<'PY'
          import requests
          import fitz
          import json
          import re
          from bs4 import BeautifulSoup
          from datetime import datetime
          from zoneinfo import ZoneInfo

          page_url = "https://www.beaverton.k12.or.us/departments/nutrition-services/menus"
          today = datetime.now(ZoneInfo("America/Los_Angeles"))
          month = today.strftime("%B")

          response = requests.get(page_url, timeout=30)
          response.raise_for_status()
          soup = BeautifulSoup(response.text, "html.parser")

          menus = {}

          for link in soup.find_all("a", href=True):
              label = " ".join(link.get_text(" ", strip=True).split())
              href = link["href"]
              text = label.lower()

              if not href.lower().endswith(".pdf"):
                  continue
              if "elementary" not in text or month.lower() not in text:
                  continue

              kind = None
              if "breakfast" in text:
                  kind = "breakfast"
              elif "lunch" in text:
                  kind = "lunch"

              if kind:
                  if href.startswith("/"):
                      href = "https://www.beaverton.k12.or.us" + href
                  elif href.startswith("//"):
                      href = "https:" + href
                  elif not href.startswith("http"):
                      from urllib.parse import urljoin
                      href = urljoin(page_url, href)

                  menus[kind] = {"label": label, "url": href}

          if set(menus) != {"breakfast", "lunch"}:
              raise Exception(
                  f"Could not find both {month} elementary PDFs. Found: {menus}"
              )

          output = {
              "month": month,
              "updated": today.isoformat(),
              "source": page_url,
              "menus": {}
          }

          for kind, info in menus.items():
              pdf_response = requests.get(info["url"], timeout=60)
              pdf_response.raise_for_status()

              document = fitz.open(stream=pdf_response.content, filetype="pdf")
              extracted_text = "\n".join(
                  page.get_text("text") for page in document
              )

              output["menus"][kind] = {
                  "label": info["label"],
                  "url": info["url"],
                  "text": extracted_text
              }

          with open("menu-source.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Downloaded and extracted {month} elementary menus.")
          PY

      - name: Save updated menu data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add menu-source.json
          git diff --cached --quiet || git commit -m "Update school menu source"
          git push
